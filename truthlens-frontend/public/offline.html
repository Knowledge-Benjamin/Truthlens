<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline — Deepfake A.I Detector</title>
  <style>
    body { margin:0; background:#020617; color:#e2e8f0; font-family:Inter,system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; text-align:center; }
    .card { max-width:380px; }
    .icon { font-size:4rem; margin-bottom:1rem; }
    h1 { font-size:1.75rem; font-weight:800; margin:0 0 0.5rem; }
    p { color:#94a3b8; line-height:1.6; margin:0 0 1.5rem; }
    a { background:linear-gradient(135deg,#6272f5,#8b5cf6); color:#fff; text-decoration:none; padding:0.75rem 2rem; border-radius:0.75rem; font-weight:600; display:inline-block; }
    .tip { background:#0f172a; border:1px solid #1e293b; border-radius:1rem; padding:1rem; margin-top:1.5rem; font-size:0.875rem; color:#64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>No internet connection detected. The Learning Hub lessons and Quiz are still available — they were saved to your device.</p>
    <a href="/">Go to Home</a>
    <div class="tip">
      💡 Tip: The detector, URL scanner, and camera scanner require internet. Everything else works offline.
    </div>
  </div>
</body>
</html>
