# Deepfake A.I Detector — Full-stack Docker Compose
# Track 6: AI for Digital Trust & Protection Against Manipulated Content
#
# Usage:
#   docker compose up -d --build   (build + start detached)
#   docker compose up --build      (start with logs)
#   docker compose down            (stop)
#   docker compose logs -f backend (stream backend logs)
#
# Frontend : http://localhost:3000
# Backend  : http://localhost:8081
# API docs : http://localhost:8081/docs

services:
  backend:
    build:
      context: ./truthlens-backend
      dockerfile: Dockerfile
    container_name: deepfake-ai-detector-backend
    ports:
      - "8081:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN:-}
      - SUNBIRD_API_TOKEN=${SUNBIRD_API_TOKEN:-}
      - SUNBIRD_BASE_URL=${SUNBIRD_BASE_URL:-https://api.sunbird.ai}
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      # Persist downloaded HF models (~750 MB total) across container restarts
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 300s   # models take time to download on first run
      retries: 5

  frontend:
    build:
      context: ./truthlens-frontend
      dockerfile: Dockerfile
    container_name: deepfake-ai-detector-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf_cache:
    driver: local
